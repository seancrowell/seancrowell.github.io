project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    # Pages kept in the repo but not published until they have real content
    - "!join.qmd"
    - "!people/"
    - "!blog/"
    - "!research/projects/"

website:
  title: "Sean M. R. Crowell"
  site-url: "https://seancrowell.github.io"
  description: "Sean M. R. Crowell, Department of Earth and Environmental Sciences, University of Rochester: satellite remote sensing of greenhouse gases, radiative transfer, and flux estimation."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: publications.qmd
        text: Publications
      - href: contact.qmd
        text: Contact
    right:
      - href: https://erselab.github.io
        text: ERSeLab
      - icon: github
        href: https://github.com/erselab
        aria-label: GitHub
  search: true
  page-footer:
    left: "© 2026 Sean M. R. Crowell · Department of Earth and Environmental Sciences, University of Rochester"
    right:
      - text: "Accessibility"
        href: accessibility.qmd

format:
  html:
    theme:
      light: [cosmo, brand-light.scss]
      dark: [cosmo, brand-dark.scss]
    css: styles.css
    toc: false
    smooth-scroll: true

execute:
  freeze: auto
